<!DOCTYPE html>
<html>
<head>
<title>Atelier Floral</title>
<style>
body{
font-family:Arial;
background:#ffeef5;
text-align:center;
padding:40px;
color:#d63384;
}
.box{
background:white;
padding:30px;
border-radius:20px;
max-width:600px;
margin:auto;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}
input,textarea{
width:90%;
padding:12px;
margin:10px;
border:1px solid #f8c8dc;
border-radius:10px;
}
button{
background:#ff69b4;
color:white;
padding:15px 25px;
border:none;
border-radius:12px;
cursor:pointer;
}
</style>
</head>
<body>
<div class="box">
<h1>🌸 Atelier Floral 🌸</h1>
<p>Encomendas de flores de cetim</p>

<input placeholder="Nome">
<input placeholder="Número de telefone">
<input type="date">
<textarea placeholder="Detalhes da encomenda"></textarea>

<button>Enviar Encomenda</button>
</div>
</body>
</html>
